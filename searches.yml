# Job searches run every day by .github/workflows/daily-jobs.yml
#
# Each search is run around `location` within `radius_miles`.
# 100 miles around San Francisco covers the whole Bay Area, including
# Santa Clara, Palo Alto, Sunnyvale, Mountain View and Fremont.
#
# API budget (free JSearch plan, ~200 requests/month):
#   6 searches x 1 page x 30 days = 180 requests/month.
#   Adding a search or a page adds 30 requests/month.
#
# date_posted: today | 3days | week | month | all
# pages_per_role: each page is ~10 jobs and costs one API request.

location: San Francisco, CA
country: us
radius_miles: 100
date_posted: today
pages_per_role: 1
employment_types: FULLTIME

# Broad searches. Search engines match related titles, so these also cover
# Senior Cloud Platform / Operations / Systems / Reliability / Services /
# Solutions / Support / Network / Automation / Deployment / Integration /
# Performance / Monitoring / Optimization / Scalability Engineer.
roles:
  - Platform Engineer
  - Cloud Engineer
  - DevOps Engineer
  - Site Reliability Engineer
  - Cloud Infrastructure Engineer
  - Cloud Security Engineer

filters:
  # Keep only jobs whose title contains one of these (matched at word start,
  # so "platform" also matches "Platforms").
  title_keywords:
    - platform
    - cloud
    - devops
    - sre
    - site reliability
    - reliability
    - infrastructure
    - kubernetes

  # Skip contract, temporary and part-time jobs.
  contract_title_keywords:
    - contract
    - contractor
    - temporary
    - part-time
    - part time
    - intern
    - internship
    - c2c
    - w2
    - "1099"
  contract_description_phrases:
    - c2c
    - corp to corp
    - corp-to-corp
    - contract to hire
    - contract-to-hire
    - contract role
    - contract position
    - contract duration
    - w2 only
    - "1099"

  # H-1B: skip jobs whose description rules out visa sponsorship
  # (regular expressions, case-insensitive). Jobs that don't mention
  # sponsorship are kept, since most postings don't say either way.
  no_sponsorship_patterns:
    - "(unable|not able|cannot|can ?not|will not|won't|do not|does not|don't|doesn't|are not|is not|not)( be)?( able)?( to)?( currently)?( in a position to)?( offer| provide| support)?( any)?( visa| immigration| work visa)? sponsor"
    - "no (visa |immigration |h-?1b )?sponsorship"
    - "(not|n't) (now or in the future |currently |ever )?(require|need) (visa |employer |immigration |h-?1b )?sponsorship"
    - "sponsorship (is |will )?(not |un)(available|be (offered|provided))"
    - "not eligible for (visa |immigration |employer )?sponsorship"
    - "without (the need for |requiring |needing )?(current or future |now or in the future )?(visa |employer |immigration )?sponsorship"
    - "(us|u\\.s\\.) citizens? only"
    - "must be (a )?(us|u\\.s\\.) citizen"
    - "(us|u\\.s\\.) citizenship (is )?required"
    - "(green card|gc) holders? only"
    - "security clearance"
    - "ts/sci|top secret"
  # Jobs matching these get a check mark in the report's H-1B column.
  sponsorship_patterns:
    - "h-?1b"
    - "visa sponsorship"
    - "sponsorship (is )?available"
    - "will sponsor"
    - "we sponsor"
  # true = list only jobs that mention sponsorship (expect very few).
  only_jobs_mentioning_sponsorship: false

  # Skip staffing, recruiting and consulting firms. Keywords match the start
  # of a word in the employer name ("consult" matches "Consulting").
  staffing_name_keywords:
    - staffing
    - recruit
    - talent
    - consult
    - workforce
    - search group
    - placement
    - manpower
