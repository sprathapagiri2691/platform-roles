# Startup career boards checked on every run by scripts/startup_jobs.py.
#
# These are the companies' own job boards on Greenhouse, Lever and Ashby.
# Their public APIs are free and don't use the JSearch quota, and every link
# goes straight to the company's application form.
#
# To add a company, find its careers page URL:
#   boards.greenhouse.io/<board> or job-boards.greenhouse.io/<board>  -> ats: greenhouse
#   jobs.lever.co/<board>                                             -> ats: lever
#   jobs.ashbyhq.com/<board>                                          -> ats: ashby
# The same title, contract, and visa-sponsorship filters as searches.yml apply.

# Only list jobs first published within this many days (0 = all open jobs).
max_age_days: 7

# A job is kept when one of its locations mentions one of these places
# (all within about 100 miles of San Francisco). Towns that share a name with
# places elsewhere (Dublin, Newark, Concord) are listed with their state.
locations:
  - San Francisco
  - SF
  - Bay Area
  - South San Francisco
  - Oakland
  - Berkeley
  - Emeryville
  - Alameda
  - San Mateo
  - Burlingame
  - San Bruno
  - Foster City
  - Redwood City
  - San Carlos
  - Menlo Park
  - Palo Alto
  - Mountain View
  - Los Altos
  - Sunnyvale
  - Santa Clara
  - Cupertino
  - San Jose
  - Campbell
  - Los Gatos
  - Milpitas
  - Fremont
  - Newark, CA
  - Newark, California
  - Hayward
  - Pleasanton
  - Dublin, CA
  - Dublin, California
  - San Ramon
  - Walnut Creek
  - Concord, CA
  - Concord, California
  - Livermore
  - San Rafael
  - Novato
  - Petaluma
  - Santa Rosa
  - Napa
  - Vallejo
  - Santa Cruz
  - Sacramento
  - Davis
  - Stockton

# true = also keep jobs listed only as remote.
include_remote: false

