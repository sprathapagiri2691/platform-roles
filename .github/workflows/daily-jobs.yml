name: Daily job postings

on:
  # Scheduled runs are paused. Uncomment these lines to turn them back on.
  # schedule:
  #   # 02:00 UTC = 7 PM Pacific daylight time (6 PM in winter, standard time).
  #   # GitHub can start scheduled runs several minutes late.
  #   - cron: "0 2 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  fetch:
    name: Job Postings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch new job postings
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: python scripts/fetch_jobs.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Job postings for $(TZ=America/Los_Angeles date +%F)"
            git push
          fi
